name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential git zip unzip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          pip install buildozer cython==0.29.37

      - name: Extract project
        run: |
          unzip -q github-apk-project.zip
          PROJECT=$(find . -name buildozer.spec -printf '%h\n' | head -1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          cd "$PROJECT"
          yes | buildozer -v android debug

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-app-apk
          path: "**/bin/*.apk"
